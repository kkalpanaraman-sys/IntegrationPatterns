spring.application.name=kafka-camel-order-processing
server.port=8080

kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:order-integration}
kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
kafka.consumer.consumers=${KAFKA_CONSUMERS:10}

downstream.max-concurrency=${DOWNSTREAM_MAX_CONCURRENCY:1000}
downstream.queue-size=${DOWNSTREAM_QUEUE_SIZE:2000}

retry.max-redeliveries=${RETRY_MAX_REDELIVERIES:3}
retry.delay-ms=${RETRY_DELAY_MS:1000}


logging.level.org.apache.camel=INFO
logging.level.com.example.orderintegration=INFO
